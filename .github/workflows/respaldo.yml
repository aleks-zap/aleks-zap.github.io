# Respaldo semanal de la base de Supabase (gratuito, con GitHub Actions).
# El repositorio es público, así que el respaldo NO se guarda en el repositorio:
# se cifra con una contraseña y se guarda como «artifact» de la ejecución durante 90 días.
# Secretos necesarios (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL     → cadena «Session pooler» de Supabase (botón Connect), con tu contraseña de la base
#   BACKUP_PASSPHRASE   → una contraseña larga que inventas tú, para cifrar el respaldo (guárdala bien)
name: Respaldo semanal de Supabase

on:
  schedule:
    - cron: '17 8 * * 0'   # domingos 08:17 UTC (03:17 en Ecuador)
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

jobs:
  respaldo:
    runs-on: ubuntu-latest
    env:
      supabase_db_url: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Copiar roles, estructura y datos
        run: |
          mkdir respaldo
          supabase db dump --remote="$supabase_db_url" -f respaldo/roles.sql --role-only
          supabase db dump --remote="$supabase_db_url" -f respaldo/schema.sql
          supabase db dump --remote="$supabase_db_url" -f respaldo/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"
          ls -la respaldo

      - name: Cifrar
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$PASS" || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          tar czf respaldo.tar.gz respaldo
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "respaldo-$(date +%F).tar.gz.gpg" respaldo.tar.gz
          rm -rf respaldo respaldo.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-supabase
          path: respaldo-*.tar.gz.gpg
          retention-days: 90
